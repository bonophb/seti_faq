<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETI 보드게임 FAQ / SETI Board Game FAQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        .faq-item { background-color: #161b22; border: 1px solid #30363d; transition: all 0.2s ease; }
        .faq-item:hover { border-color: #58a6ff; }
        .tab-btn, .lang-btn { background-color: #161b22; border: 1px solid #30363d; color: #8b949e; }
        .tab-btn.active, .lang-btn.active { background-color: #1f6beb; border-color: #388bfd; color: #ffffff; font-weight: 600; }
        .category-btn { background-color: #21262d; color: #8b949e; }
        .category-btn.active { background-color: #388bfd; color: #ffffff; }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto">
        <!-- 상단 네비게이션: 캐시 새로고침 버튼 (좌측) & 언어 선택 (우측) -->
        <div class="flex justify-between items-center mb-6">
            <button onclick="forceReload()" class="px-3.5 py-1.5 rounded-xl bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-[#58a6ff] text-xs sm:text-sm font-medium text-gray-300 hover:text-white transition-all inline-flex items-center gap-1.5 shadow-sm cursor-pointer">
                <span class="text-sm">🔄</span>
                <span id="reload-btn-text">캐시 새로고침</span>
            </button>

            <div class="inline-flex rounded-xl p-1 bg-[#161b22] border border-[#30363d] gap-1">
                <button onclick="setLanguage('KO')" id="lang-KO" class="lang-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all">🇰🇷 한국어</button>
                <button onclick="setLanguage('EN')" id="lang-EN" class="lang-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all">🇺🇸 English</button>
            </div>
        </div>

        <header class="text-center mb-8">
            <h1 id="header-title" class="text-3xl sm:text-4xl font-bold text-white mb-2">🛸 SETI 보드게임 FAQ</h1>
            <p id="header-sub" class="text-gray-400 text-sm sm:text-base">규칙, 에라타 및 카드 검색 시스템</p>
        </header>

        <!-- 1차 구분 탭 (전체 / 본판 / 확장) -->
        <div class="flex justify-center gap-3 mb-6">
            <button onclick="setEdition('전체')" id="tab-전체" class="tab-btn active px-5 py-2.5 rounded-xl text-sm sm:text-base transition-all flex items-center gap-2">
                <span>🌐</span> <span id="label-all">전체</span>
            </button>
            <button onclick="setEdition('본판')" id="tab-본판" class="tab-btn px-5 py-2.5 rounded-xl text-sm sm:text-base transition-all flex items-center gap-2">
                <span>📦</span> <span id="label-base">본판</span>
            </button>
            <button onclick="setEdition('확장')" id="tab-확장" class="tab-btn px-5 py-2.5 rounded-xl text-sm sm:text-base transition-all flex items-center gap-2">
                <span>🛸</span> <span id="label-exp">확장</span>
            </button>
        </div>

        <!-- 검색창 -->
        <div class="mb-6">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="질문 제목, 답변 내용, 카드 번호(예: 15, #15, ET.1) 검색..." 
                       class="w-full bg-[#161b22] border border-[#30363d] rounded-xl px-5 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff] text-base">
                <span class="absolute right-4 top-3.5 text-gray-500">🔍</span>
            </div>
            <p id="search-tip" class="text-xs text-gray-500 mt-2 px-1">💡 팁: 숫자만 입력해도 해당 카드 번호(#15, #120 등)를 정밀하게 자동 검색합니다.</p>
        </div>

        <!-- 세부 카테고리 필터 버튼 -->
        <div id="categoryContainer" class="flex flex-wrap gap-2 mb-8 justify-center"></div>

        <!-- FAQ 목록 -->
        <div id="faqList" class="space-y-4">
            <div class="text-center py-12 text-gray-400">FAQ 데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1H8VjQ4cSiOKzghHHUsna8KWBzVYm-YB-GPgj_haSr88';
        const PUBLISHED_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQYjGO3WyNoP4Pg3AJ8neCz4GYD1o9wVOjWnxvyIGpmImV3KnERKDG3Q_1_TdtQxWGwC22E8CbM6SWf/pub?output=csv';
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        // 카테고리 기본 매핑 사전 (시트 데이터 보완용)
        const categoryMap = {
            '행동': 'Actions',
            '착륙': 'Land',
            '스캔': 'Scan',
            '데이터 분석': 'Analyze Data',
            '탐사선/궤도선/착륙선': 'Probes / Orbiters / Landers',
            '기술': 'Techs',
            '미션': 'Missions',
            '데이터': 'Data',
            '마일스톤': 'Milestones',
            '점수 타일': 'Gold Scoring Tiles',
            '외계종': 'Alien Species',
            '솔로모드': 'Solo Game',
            '카드': 'Cards',
            '외계종 카드': 'Alien Cards',
            '기업': 'Organizations',
            '확장 세팅': 'Expansion Settings',
            '프로모 카드': 'Promo Cards'
        };

        function detectInitialLanguage() {
            const userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            return userLang.startsWith('ko') ? 'KO' : 'EN';
        }

        let faqData = [];
        let currentLang = detectInitialLanguage();
        let currentEdition = '전체';
        let currentCategory = '전체';
        
        let loadTimer = null;
        let isLoaded = false;

        const i18n = {
            KO: {
                title: "🛸 SETI 보드게임 FAQ",
                sub: "규칙, 에라타 및 카드 검색 시스템",
                all: "전체",
                base: "본판",
                exp: "확장",
                placeholder: "질문 제목, 답변 내용, 카드 번호(예: 15, #15, ET.1) 검색...",
                tip: "💡 팁: 숫자만 입력해도 해당 카드 번호(#15, #120 등)를 정밀하게 자동 검색합니다.",
                reloadText: "캐시 새로고침",
                noResult: "검색 조건에 맞는 FAQ가 없습니다.",
                loading: "FAQ 데이터를 불러오는 중입니다...",
                delayMsg: "데이터 로드가 지연되어 캐시를 삭제하고 자동 재시도합니다...",
                reloadBtn: "지금 강력 새로고침"
            },
            EN: {
                title: "🛸 SETI Board Game FAQ",
                sub: "Rules, Errata & Card Search System",
                all: "All",
                base: "Base Game",
                exp: "Expansion",
                placeholder: "Search questions, answers, card # (e.g. 15, #15, ET.1)...",
                tip: "💡 Tip: Type a pure number to automatically search for matching card #s (#15, #120, etc.).",
                reloadText: "Clear Cache & Reload",
                noResult: "No FAQs match your search criteria.",
                loading: "Loading FAQ data...",
                delayMsg: "Loading delayed over 30s. Clearing cache and auto-retrying...",
                reloadBtn: "Force Reload Now"
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = i18n[lang];
            document.getElementById('header-title').textContent = t.title;
            document.getElementById('header-sub').textContent = t.sub;
            document.getElementById('searchInput').placeholder = t.placeholder;
            document.getElementById('search-tip').textContent = t.tip;
            document.getElementById('reload-btn-text').textContent = t.reloadText;

            updateTabCounts();
            renderCategories();
            renderFAQs();
        }

        function getBustedUrl(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}_cb=${Date.now()}`;
        }

        function startTimeoutTimer() {
            clearTimeout(loadTimer);
            loadTimer = setTimeout(() => {
                if (!isLoaded) {
                    if ('caches' in window) {
                        caches.keys().then(names => names.forEach(name => caches.delete(name)));
                    }
                    const t = i18n[currentLang];
                    document.getElementById('faqList').innerHTML = 
                        `<div class="text-center py-12 text-amber-400 font-medium leading-relaxed">
                            ${t.delayMsg}
                            <br><button onclick="forceReload()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-500 transition-colors">${t.reloadBtn}</button>
                         </div>`;
                    setTimeout(() => loadCSV(GVIZ_URL, true), 1000);
                }
            }, 30000);
        }

        function forceReload() {
            if ('caches' in window) {
                caches.keys().then(names => names.forEach(name => caches.delete(name)));
            }
            window.location.href = window.location.pathname + '?_t=' + Date.now();
        }

        function loadCSV(url, isFallback = false) {
            if (!isFallback) {
                isLoaded = false;
                startTimeoutTimer();
            }

            Papa.parse(getBustedUrl(url), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const parsed = results.data.map(item => {
                        const cat_ko = item['카테고리 (KO)'] ? item['카테고리 (KO)'].trim() : (item['카테고리'] ? item['카테고리'].trim() : '기타');
                        const cat_en = item['카테고리 (EN)'] ? item['카테고리 (EN)'].trim() : (categoryMap[cat_ko] || cat_ko);
                        
                        let ed = item['구분'] ? item['구분'].trim() : '';
                        if (!ed) {
                            ed = (cat_ko.includes('확장') || cat_ko.includes('기관') || cat_ko.includes('프로모')) ? '확장' : '본판';
                        }
                        
                        const q_ko = item['질문 (KO)'] ? item['질문 (KO)'].trim() : (item['질문'] ? item['질문'].trim() : '');
                        const a_ko = item['답변 (KO)'] ? item['답변 (KO)'].trim() : (item['답변'] ? item['답변'].trim() : '');
                        const q_en = item['질문 (EN)'] ? item['질문 (EN)'].trim() : q_ko;
                        const a_en = item['답변 (EN)'] ? item['답변 (EN)'].trim() : a_ko;

                        return {
                            edition: ed,
                            cat_ko: cat_ko,
                            cat_en: cat_en,
                            q_ko: q_ko,
                            a_ko: a_ko,
                            q_en: q_en,
                            a_en: a_en
                        };
                    }).filter(item => item.q_ko !== '' || item.q_en !== '');

                    if (parsed.length > 0) {
                        isLoaded = true;
                        clearTimeout(loadTimer);
                        faqData = parsed;
                        
                        setLanguage(currentLang);
                    } else if (!isFallback) {
                        loadCSV(GVIZ_URL, true);
                    } else {
                        clearTimeout(loadTimer);
                        showError('FAQ 데이터를 읽지 못했습니다. 구글 시트 공유 설정을 확인해주세요.');
                    }
                },
                error: function(err) {
                    if (!isFallback) {
                        loadCSV(GVIZ_URL, true);
                    } else {
                        clearTimeout(loadTimer);
                        showError('데이터 로드에 실패했습니다. 아래 버튼을 눌러 강력 새로고침을 시도해보세요.<br><button onclick="forceReload()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-500">강력 새로고침</button>');
                    }
                }
            });
        }

        function showError(msg) {
            document.getElementById('faqList').innerHTML = `<div class="text-center py-12 text-red-400 font-medium">${msg}</div>`;
        }

        function updateTabCounts() {
            const t = i18n[currentLang];
            const baseCount = faqData.filter(d => d.edition === '본판').length;
            const expCount = faqData.filter(d => d.edition === '확장').length;
            
            document.getElementById('label-all').textContent = `${t.all} (${faqData.length})`;
            document.getElementById('label-base').textContent = `${t.base} (${baseCount})`;
            document.getElementById('label-exp').textContent = `${t.exp} (${expCount})`;
        }

        function setEdition(edition) {
            currentEdition = edition;
            currentCategory = '전체';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${edition}`).classList.add('active');
            renderCategories();
            renderFAQs();
        }

        function renderCategories() {
            let availableData = faqData;
            if (currentEdition !== '전체') {
                availableData = faqData.filter(item => item.edition === currentEdition);
            }

            const isKO = currentLang === 'KO';
            const categories = ['전체', ...new Set(availableData.map(item => isKO ? item.cat_ko : item.cat_en))];
            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';

            const tAll = i18n[currentLang].all;

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn px-4 py-2 rounded-full text-sm font-medium transition-colors ${cat === currentCategory ? 'active' : ''}`;
                btn.textContent = cat === '전체' ? tAll : cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderFAQs();
                };
                container.appendChild(btn);
            });
        }

        function toggleEnOriginal(index) {
            const box = document.getElementById(`en-box-${index}`);
            if (box) {
                box.classList.toggle('hidden');
            }
        }

        function renderFAQs() {
            const rawQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const listContainer = document.getElementById('faqList');
            
            const filtered = faqData.filter(item => {
                const matchesEdition = currentEdition === '전체' || item.edition === currentEdition;
                
                let matchesCategory = currentCategory === '전체';
                if (!matchesCategory) {
                    matchesCategory = (item.cat_ko === currentCategory || item.cat_en === currentCategory);
                }

                if (!matchesEdition || !matchesCategory) return false;
                if (!rawQuery) return true;

                const qKo = item.q_ko.toLowerCase();
                const aKo = item.a_ko.toLowerCase();
                const qEn = item.q_en.toLowerCase();
                const aEn = item.a_en.toLowerCase();

                // 1. 질문 제목과 답변 내용 기준 검색
                if (qKo.includes(rawQuery) || aKo.includes(rawQuery) || qEn.includes(rawQuery) || aEn.includes(rawQuery)) return true;

                // 2. 카드 번호 스마트 매칭 (질문 제목 기준)
                const cleanQuery = rawQuery.replace(/^#/, '');
                if (/^\d+$/.test(cleanQuery)) {
                    const num = parseInt(cleanQuery, 10);
                    const numPattern = new RegExp(`#0*${num}(?=[^0-9]|$)`, 'i');
                    if (numPattern.test(qKo) || numPattern.test(qEn)) return true;
                }

                // 3. 외계종 카드 번호 스마트 매칭
                if (/^et\s*\.?\s*\d+/i.test(rawQuery)) {
                    const etNum = rawQuery.replace(/[^0-9]/g, '');
                    const etPattern = new RegExp(`#et\\s*\\.?\\s*0*${etNum}`, 'i');
                    if (etPattern.test(qKo) || etPattern.test(qEn)) return true;
                }

                return false;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-12 text-gray-500">${i18n[currentLang].noResult}</div>`;
                return;
            }

            listContainer.innerHTML = filtered.map((item, index) => {
                const badgeColor = item.edition === '확장' 
                    ? 'bg-purple-900/50 text-purple-300 border border-purple-700/50' 
                    : 'bg-blue-900/50 text-blue-300 border border-blue-700/50';
                
                const edLabel = currentLang === 'EN' ? (item.edition === '확장' ? 'Expansion' : 'Base') : item.edition;
                const catLabel = currentLang === 'EN' ? item.cat_en : item.cat_ko;
                const isCard = item.cat_ko.includes('카드') || item.q_ko.startsWith('#');

                // [수정된 질문 제목 설정 로직]
                let displayQuestion = '';
                if (currentLang === 'EN') {
                    // 영문 모드일 때는 무조건 영문 질문 제목(카드명 포함)을 최우선으로 출력
                    displayQuestion = item.q_en || item.q_ko;
                } else {
                    // 한국어 모드일 때
                    displayQuestion = item.q_ko;
                    // 카드 FAQ의 경우 한글명 뒤에 영문명을 병기 (#번호 한글명 (English Name))
                    if (isCard && item.q_en) {
                        const cleanEn = item.q_en.replace(/^#[a-zA-Z0-9.\s]+/, '').trim();
                        if (cleanEn && !item.q_ko.toLowerCase().includes(cleanEn.toLowerCase())) {
                            displayQuestion = `${item.q_ko} (${cleanEn})`;
                        }
                    }
                }

                // [수정된 답변 내용 구성 로직]
                let displayAnswer = '';
                if (currentLang === 'EN') {
                    // 영문 모드일 때는 영문 답변만 단독 출력
                    displayAnswer = (item.a_en || item.a_ko).replace(/\n/g, '<br>');
                } else {
                    // 한국어 모드일 때: 한국어 답변 + 영어 원문 보기 토글 버튼 제공
                    displayAnswer = item.a_ko.replace(/\n/g, '<br>');
                    if (item.a_en && item.a_en !== item.a_ko) {
                        displayAnswer += `
                            <div class="mt-4 pt-3 border-t border-[#30363d]/60">
                                <button onclick="toggleEnOriginal(${index})" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] hover:border-[#58a6ff] text-xs font-medium text-gray-200 hover:text-white transition-all shadow-sm focus:outline-none cursor-pointer">
                                    <span>🇺🇸</span>
                                    <span>영어 원문 보기</span>
                                </button>
                                <div id="en-box-${index}" class="hidden mt-3 p-4 rounded-xl bg-[#161b22] border border-[#30363d] text-xs sm:text-sm text-gray-300 leading-relaxed space-y-2">
                                    <div class="font-bold text-gray-200 border-b border-[#30363d] pb-2">${item.q_en}</div>
                                    <div>${item.a_en.replace(/\n/g, '<br>')}</div>
                                </div>
                            </div>
                        `;
                    }
                }

                return `
                <div class="faq-item rounded-xl overflow-hidden">
                    <button onclick="toggleFAQ(${index})" class="w-full text-left p-5 flex justify-between items-center focus:outline-none">
                        <div>
                            <div class="flex gap-2 items-center mb-2">
                                <span class="text-xs px-2 py-0.5 rounded-md font-semibold ${badgeColor}">${edLabel}</span>
                                <span class="text-xs px-2.5 py-0.5 rounded-md bg-gray-800 text-gray-300 font-medium">${catLabel}</span>
                            </div>
                            <h3 class="text-lg font-semibold text-white">${displayQuestion}</h3>
                        </div>
                        <span id="icon-${index}" class="text-gray-400 text-xl ml-4 font-bold">+</span>
                    </button>
                    <div id="answer-${index}" class="hidden px-5 pb-5 pt-1 text-gray-300 border-t border-[#21262d] text-base leading-relaxed bg-[#0d1117]/40">
                        ${displayAnswer}
                    </div>
                </div>
                `;
            }).join('');
        }

        function toggleFAQ(index) {
            const answer = document.getElementById(`answer-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            
            if (answer.classList.contains('hidden')) {
                answer.classList.remove('hidden');
                icon.textContent = '−';
            } else {
                answer.classList.add('hidden');
                icon.textContent = '+';
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderFAQs);
        loadCSV(PUBLISHED_URL);
    </script>
</body>
</html>
