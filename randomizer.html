<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETI 외계종 발견 랜더마이저 / Alien Discovery Randomizer</title>
    
    <!-- Google tag (gtag.js) - GA4 트래픽 및 맞춤 이벤트 추적 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D8WD3NKS7N"></script>
    <script src="./shared.js"></script>

    <!-- PWA 메타 태그 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        .lang-btn { background-color: #161b22; border: 1px solid #30363d; color: #8b949e; }
        .lang-btn.active { background-color: #1f6beb; border-color: #388bfd; color: #ffffff; font-weight: 600; }
        .glass-card { background-color: #161b22; border: 1px solid #30363d; }
        .alien-card { transition: all 0.2s ease; }
        .alien-card:hover { transform: translateY(-2px); }
        button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible {
            outline: 3px solid #58a6ff !important; outline-offset: 3px;
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
    <div id="page-content" class="max-w-3xl mx-auto">
        <!-- 상단 네비게이션 -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
                <a href="./index.html" class="px-3.5 py-1.5 rounded-xl bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-[#58a6ff] text-xs sm:text-sm font-medium text-gray-300 hover:text-white transition-all inline-flex items-center gap-1.5 shadow-sm">
                    <span>📚</span>
                    <span id="nav-faq">SETI FAQ</span>
                </a>
                <button onclick="resetAll()" class="px-3.5 py-1.5 rounded-xl bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-red-500 text-xs sm:text-sm font-medium text-red-400 hover:text-red-300 transition-all inline-flex items-center gap-1.5 shadow-sm cursor-pointer">
                    <span>🔄</span>
                    <span id="nav-reset">초기화</span>
                </button>
            </div>

            <!-- 언어 선택 -->
            <div class="inline-flex rounded-xl p-1 bg-[#161b22] border border-[#30363d] gap-1">
                <button onclick="setLanguage('KO')" id="lang-KO" class="lang-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all">🇰🇷 한국어</button>
                <button onclick="setLanguage('EN')" id="lang-EN" class="lang-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all">🇺🇸 English</button>
            </div>
        </div>

        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 id="header-title" class="text-3xl sm:text-4xl font-bold text-white mb-2">👾 외계종 발견 랜더마이저</h1>
            <p id="header-sub" class="text-gray-400 text-sm sm:text-base">본판 및 확장 외계종 추첨 돌림판 시스템</p>
        </header>

        <!-- 경고 알림 토스트 (최소 2종 제한 경고) -->
        <div id="toast" role="status" aria-live="polite" class="hidden fixed top-6 left-1/2 transform -translate-x-1/2 bg-red-900/90 border border-red-500 text-white px-5 py-3 rounded-xl shadow-2xl z-50 text-sm font-medium transition-all flex items-center gap-2">
            <span>⚠️</span>
            <span id="toast-msg">최소 2개의 외계종은 남아있어야 합니다.</span>
        </div>

        <!-- STEP 1: 게임 모드 선택 -->
        <div id="step-mode" class="space-y-6">
            <div class="text-center mb-4">
                <h2 id="title-step1" tabindex="-1" class="text-xl font-semibold text-white">1단계: 게임 모드를 선택하세요</h2>
                <p id="desc-step1" class="text-xs text-gray-400 mt-1">플레이할 게임 버전에 따라 외계종 풀이 결정됩니다.</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="selectMode('BASE')" class="glass-card hover:border-[#58a6ff] hover:bg-[#21262d] p-6 rounded-2xl text-left transition-all group cursor-pointer">
                    <div class="text-3xl mb-3">📦</div>
                    <h3 id="mode-base-title" class="text-lg font-bold text-white group-hover:text-blue-400 transition-colors">본판만 진행 (5종)</h3>
                    <p id="mode-base-desc" class="text-xs text-gray-400 mt-1">마스카마이트, 어노말리, 오우무아무아, 센타우리안, 엑설티안</p>
                </button>
                <button onclick="selectMode('EXP')" class="glass-card hover:border-[#58a6ff] hover:bg-[#21262d] p-6 rounded-2xl text-left transition-all group cursor-pointer">
                    <div class="text-3xl mb-3">🛸</div>
                    <h3 id="mode-exp-title" class="text-lg font-bold text-white group-hover:text-purple-400 transition-colors">본판 + 확장 포함 (8종)</h3>
                    <p id="mode-exp-desc" class="text-xs text-gray-400 mt-1">본판 5종 + 아르코스, 글리피즈, 아메바</p>
                </button>
            </div>
        </div>

        <!-- STEP 2: 외계종 밴(제외) 설정 -->
        <div id="step-ban" class="hidden space-y-6">
            <div class="text-center mb-2">
                <h2 id="title-step2" tabindex="-1" class="text-xl font-semibold text-white">2단계: 제외(밴)할 외계종 선택</h2>
                <p id="desc-step2" class="text-xs text-gray-400 mt-1">제외할 외계종을 클릭하여 비활성화하세요. (최소 2종 필수 잔여)</p>
            </div>

            <!-- 외계종 그리드 -->
            <div id="ban-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>

            <div class="flex justify-between items-center pt-4 border-t border-[#30363d]">
                <button onclick="goToStep('mode')" id="btn-back-mode" class="px-4 py-2 rounded-xl bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-xs text-gray-300 hover:text-white transition-colors cursor-pointer">
                    ← 모드 재선택
                </button>
                <button onclick="confirmBanSelection()" id="btn-confirm-ban" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all shadow-lg cursor-pointer">
                    외계종 추첨 단계로 이동 →
                </button>
            </div>
        </div>

        <!-- STEP 3: 좌/우 외계종 슬롯 및 추첨 진행 -->
        <div id="step-slots" class="hidden space-y-6">
            <div class="text-center mb-2">
                <h2 id="title-step3" tabindex="-1" class="text-xl font-semibold text-white">3단계: 왼쪽 및 오른쪽 외계종 발견 추첨</h2>
                <p id="desc-step3" class="text-xs text-gray-400 mt-1">각 슬롯의 버튼을 눌러 돌림판으로 외계종을 무작위 추첨하세요.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- 왼쪽 외계종 슬롯 -->
                <div id="slot-left" class="glass-card p-6 rounded-2xl text-center flex flex-col justify-between min-h-[230px] transition-all">
                    <div>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-blue-900/50 text-blue-300 border border-blue-700/50" id="label-left-slot">왼쪽 외계종</span>
                        <div id="left-result" role="status" aria-live="polite" class="my-5">
                            <span class="text-gray-500 text-sm" id="text-left-empty">미선택 상태</span>
                        </div>
                    </div>
                    <button id="btn-spin-left" onclick="openWheelModal('LEFT')" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold transition-all shadow-md cursor-pointer">
                        👈 <span id="text-btn-spin-left">왼쪽 외계종 추첨하기</span>
                    </button>
                </div>

                <!-- 오른쪽 외계종 슬롯 -->
                <div id="slot-right" class="glass-card p-6 rounded-2xl text-center flex flex-col justify-between min-h-[230px] transition-all">
                    <div>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-purple-900/50 text-purple-300 border border-purple-700/50" id="label-right-slot">오른쪽 외계종</span>
                        <div id="right-result" role="status" aria-live="polite" class="my-5">
                            <span class="text-gray-500 text-sm" id="text-right-empty">미선택 상태</span>
                        </div>
                    </div>
                    <button id="btn-spin-right" onclick="openWheelModal('RIGHT')" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-bold transition-all shadow-md cursor-pointer">
                        👉 <span id="text-btn-spin-right">오른쪽 외계종 추첨하기</span>
                    </button>
                </div>
            </div>

            <div class="text-center pt-4">
                <button onclick="goToStep('ban')" id="btn-back-ban" class="text-xs text-gray-400 hover:text-white underline cursor-pointer">
                    ← 제외(밴) 목록 다시 수정하기
                </button>
            </div>
        </div>
    </div>

    <!-- 룰렛 돌림판 모달 팝업 -->
    <div id="wheelModal" role="dialog" aria-modal="true" aria-labelledby="wheel-modal-title" tabindex="-1" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass-card max-w-md w-full p-6 rounded-3xl text-center relative border border-[#30363d] shadow-2xl">
            <button id="wheel-close" aria-label="추첨 창 닫기" onclick="closeWheelModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold focus:outline-none cursor-pointer">✕</button>
            
            <h3 id="wheel-modal-title" class="text-lg font-bold text-white mb-4">외계종 돌림판 추첨</h3>

            <!-- 룰렛 영역 (상단 화살표 포함) -->
            <div class="relative w-[280px] sm:w-[320px] h-[280px] sm:h-[320px] mx-auto my-4 flex items-center justify-center">
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 z-20">
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-amber-400 drop-shadow-[0_4px_6px_rgba(251,191,36,0.8)]"></div>
                </div>
                <canvas id="wheelCanvas" aria-hidden="true" width="600" height="600" class="w-full h-full rounded-full shadow-2xl border-4 border-[#30363d]"></canvas>
            </div>

            <!-- 추첨 제어 버튼 -->
            <div class="mt-6">
                <button id="btn-spin-action" onclick="handleSpinAction()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-base shadow-lg transition-all cursor-pointer">
                    🎲 <span id="btn-spin-label" aria-live="polite">추첨 시작</span>
                </button>
            </div>
        </div>
    </div>

    <script src="./randomizer.js"></script>
</body>
</html>
