<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETI 보드게임 FAQ / SETI Board Game FAQ</title>
    
    <!-- PWA 메타 태그 및 매니페스트 등록 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        .faq-item { background-color: #161b22; border: 1px solid #30363d; transition: all 0.2s ease; }

        .tab-btn.active, .lang-btn.active { background-color: #1f6beb; border-color: #388bfd; color: #ffffff; font-weight: 600; }
        .category-btn { background-color: #21262d; color: #8b949e; }
        .category-btn.active { background-color: #388bfd; color: #ffffff; }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto">
        <!-- 상단 알림 토스트 -->
        <div id="toast" class="hidden fixed top-6 left-1/2 transform -translate-x-1/2 bg-[#161b22]/95 border border-[#58a6ff] text-white px-5 py-3 rounded-2xl shadow-2xl z-50 text-sm font-medium transition-all flex items-center gap-2.5 backdrop-blur-md">
            <span id="toast-icon">✨</span>
            <span id="toast-msg">알림</span>
        </div>

        <!-- 상단 네비게이션: 캐시 새로고침 버튼 (좌측) & 언어 선택 (우측) -->
        <div class="flex justify-between items-center mb-6">
            <button onclick="forceReload()" class="px-3.5 py-1.5 rounded-xl bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-[#58a6ff] text-xs sm:text-sm font-medium text-gray-300 hover:text-white transition-all inline-flex items-center gap-1.5 shadow-sm cursor-pointer">
                <span class="text-sm">🔄</span>
                <span id="reload-btn-text">캐시 새로고침</span>
            </button>

            <div class="inline-flex rounded-xl p-1 bg-[#161b22] border border-[#30363d] gap-1">
                <button onclick="setLanguage('KO')" id="lang-KO" class="lang-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all">🇰🇷 한국어</button>
                <button onclick="setLanguage('EN')" id="lang-EN" class="lang-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all">🇺🇸 English</button>
            </div>
        </div>

        <header class="text-center mb-8">
            <h1 id="header-title" class="text-3xl sm:text-4xl font-bold text-white mb-2">🛸 SETI 보드게임 FAQ</h1>
            <p id="header-sub" class="text-gray-400 text-sm sm:text-base mb-4">규칙, 에라타 및 카드 검색 시스템</p>
            
            <!-- 상단 외부 링크 및 드롭다운 버튼 영역 -->
            <div class="flex flex-wrap justify-center items-center gap-2.5 text-xs">
                <!-- 외계종 발견 랜더마이저 버튼 -->
                <a href="./randomizer.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-blue-900/60 to-purple-900/60 hover:from-blue-800/80 hover:to-purple-800/80 border border-blue-500/50 hover:border-blue-400 text-white font-semibold transition-all shadow-md">
                    <span>👾</span>
                    <span id="link-alien-randomizer">외계종 발견 랜더마이저</span>
                    <span class="text-gray-400 text-[10px]">→</span>
                </a>

                <!-- 공식 룰북 드롭다운 메뉴 -->
                <div class="relative inline-block text-left" id="rulebookDropdownContainer">
                    <button onclick="toggleRulebookDropdown(event)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-[#58a6ff] text-gray-200 hover:text-white transition-all shadow-sm cursor-pointer focus:outline-none">
                        <span>📖</span>
                        <span id="rulebook-btn-text">공식 룰북</span>
                        <span class="text-[10px] text-gray-400">▼</span>
                    </button>

                    <!-- 드롭다운 메뉴 본체 -->
                    <div id="rulebookDropdownMenu" class="hidden absolute left-1/2 transform -translate-x-1/2 mt-2 w-56 rounded-xl bg-[#161b22] border border-[#30363d] shadow-2xl py-2 z-50 text-left">
                        <div class="px-3 py-1 text-[11px] font-semibold text-gray-400 uppercase tracking-wider border-b border-[#21262d] mb-1" id="rulebook-menu-title">
                            공식 PDF 다운로드
                        </div>
                        <a id="rb-link-base" href="" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-3.5 py-2 text-xs text-gray-300 hover:text-white hover:bg-[#21262d] transition-colors">
                            <span>📦</span> <span id="rb-text-base">본판 룰북</span> <span class="ml-auto text-[10px] text-gray-500">PDF ↗</span>
                        </a>
                        <a id="rb-link-base-alien" href="" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-3.5 py-2 text-xs text-gray-300 hover:text-white hover:bg-[#21262d] transition-colors">
                            <span>👽</span> <span id="rb-text-base-alien">본판 외계종</span> <span class="ml-auto text-[10px] text-gray-500">PDF ↗</span>
                        </a>
                        <a id="rb-link-aid" href="" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-3.5 py-2 text-xs text-gray-300 hover:text-white hover:bg-[#21262d] transition-colors">
                            <span>📋</span> <span id="rb-text-aid">요약표</span> <span class="ml-auto text-[10px] text-gray-500">PDF ↗</span>
                        </a>
                        <div class="border-t border-[#21262d] my-1"></div>
                        <a id="rb-link-exp" href="" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-3.5 py-2 text-xs text-gray-300 hover:text-white hover:bg-[#21262d] transition-colors">
                            <span>🛸</span> <span id="rb-text-exp">확장 룰북</span> <span class="ml-auto text-[10px] text-gray-500">PDF ↗</span>
                        </a>
                        <a id="rb-link-exp-alien" href="" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-3.5 py-2 text-xs text-gray-300 hover:text-white hover:bg-[#21262d] transition-colors">
                            <span>🌌</span> <span id="rb-text-exp-alien">확장 외계종</span> <span class="ml-auto text-[10px] text-gray-500">PDF ↗</span>
                        </a>
                    </div>
                </div>

                <!-- 태양계 랜더마이저 버튼 -->
                <a href="https://seti-solarsystem.czechgames.com/" target="_blank" rel="noopener noreferrer" 
                   class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-[#58a6ff] text-gray-300 hover:text-white transition-all shadow-sm">
                    <span>🪐</span>
                    <span id="link-randomizer">태양계 랜더마이저</span>
                    <span class="text-gray-500 text-[10px]">↗</span>
                </a>

                <!-- BGG 공식 FAQ 링크 버튼들 -->
                <a href="https://boardgamegeek.com/thread/3392878/official-faq-plus-cards-clarification" target="_blank" rel="noopener noreferrer" 
                   class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-[#58a6ff] text-gray-300 hover:text-white transition-all shadow-sm">
                    <span class="text-blue-400">📦</span>
                    <span id="link-bgg-base">BGG 본판 FAQ 원본</span>
                    <span class="text-gray-500 text-[10px]">↗</span>
                </a>
                <a href="https://boardgamegeek.com/thread/3602459/official-space-agencies-faq-plus-cards-clarificati" target="_blank" rel="noopener noreferrer" 
                   class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-[#58a6ff] text-gray-300 hover:text-white transition-all shadow-sm">
                    <span class="text-purple-400">🛸</span>
                    <span id="link-bgg-exp">BGG 확장 FAQ 원본</span>
                    <span class="text-gray-500 text-[10px]">↗</span>
                </a>
            </div>
        </header>

        <!-- 1차 구분 탭 (전체 / 본판 / 확장) -->
        <div class="flex justify-center gap-3 mb-6">
            <button onclick="setEdition('전체')" id="tab-전체" class="tab-btn active px-5 py-2.5 rounded-xl text-sm sm:text-base transition-all flex items-center gap-2">
                <span>🌐</span> <span id="label-all">전체</span>
            </button>
            <button onclick="setEdition('본판')" id="tab-본판" class="tab-btn px-5 py-2.5 rounded-xl text-sm sm:text-base transition-all flex items-center gap-2">
                <span>📦</span> <span id="label-base">본판</span>
            </button>
            <button onclick="setEdition('확장')" id="tab-확장" class="tab-btn px-5 py-2.5 rounded-xl text-sm sm:text-base transition-all flex items-center gap-2">
                <span>🛸</span> <span id="label-exp">확장</span>
            </button>
        </div>

        <!-- 검색창 -->
        <div class="mb-6">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="질문 제목, 답변 내용, 카드 번호(예: 15, #15, ET.1) 검색..." 
                       class="w-full bg-[#161b22] border border-[#30363d] rounded-xl px-5 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff] text-base">
                <span class="absolute right-4 top-3.5 text-gray-500">🔍</span>
            </div>
            <p id="search-tip" class="text-xs text-gray-500 mt-2 px-1">💡 팁: 숫자만 입력해도 해당 카드 번호(#15, #120 등)를 정밀하게 자동 검색합니다.</p>
        </div>

        <!-- 세부 카테고리 필터 버튼 -->
        <div id="categoryContainer" class="flex flex-wrap gap-2 mb-8 justify-center"></div>

        <!-- FAQ 목록 -->
        <div id="faqList" class="space-y-4">
            <div class="text-center py-12 text-gray-400">FAQ 데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error:', err));
            });
        }

        const SHEET_ID = '1H8VjQ4cSiOKzghHHUsna8KWBzVYm-YB-GPgj_haSr88';
        const PUBLISHED_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQYjGO3WyNoP4Pg3AJ8neCz4GYD1o9wVOjWnxvyIGpmImV3KnERKDG3Q_1_TdtQxWGwC22E8CbM6SWf/pub?output=csv';
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        const rulebookLinks = {
            KO: {
                btnText: "공식 룰북",
                menuTitle: "공식 PDF 다운로드",
                base: { title: "본판 룰북", url: "https://filemanager.czechgames.com/storage/files/seti-search-for-extraterrestrial-intelligence/rules/SE%20rulebook%20KO%2010.pdf" },
                baseAlien: { title: "본판 외계종", url: "https://filemanager.czechgames.com/storage/files/seti-search-for-extraterrestrial-intelligence/other-downloads/alien-species/SE%20aliens%20KO%2006.pdf" },
                aid: { title: "요약표", url: "https://filemanager.czechgames.com/storage/files/seti-search-for-extraterrestrial-intelligence/other-downloads/player-aid/SE%20player%20aid%20KO%2005.pdf" },
                exp: { title: "확장 룰북", url: "https://filemanager.czechgames.com/storage/files/seti-space-agencies/rules/SE2%20rulebook%20KO%2003.pdf" },
                expAlien: { title: "확장 외계종", url: "https://filemanager.czechgames.com/storage/files/seti-space-agencies/other-downloads/alien-species/SE2%20aliens%20aid%20KO%2003.pdf" }
            },
            EN: {
                btnText: "Official Rulebooks",
                menuTitle: "Official PDF Downloads",
                base: { title: "Base Rulebook", url: "https://filemanager.czechgames.com/storage/files/seti-search-for-extraterrestrial-intelligence/rules/seti-rules-en.pdf" },
                baseAlien: { title: "Base Alien Species", url: "https://filemanager.czechgames.com/storage/files/seti-search-for-extraterrestrial-intelligence/other-downloads/alien-species/seti-alien-species-en.pdf" },
                aid: { title: "Player Aid", url: "https://filemanager.czechgames.com/storage/files/seti-search-for-extraterrestrial-intelligence/other-downloads/player-aid/seti-player-aid-en.pdf" },
                exp: { title: "Expansion Rulebook", url: "https://filemanager.czechgames.com/storage/files/seti-space-agencies/rules/SE2%20rulebook%20EN%2016.pdf" },
                expAlien: { title: "Expansion Alien Species", url: "https://filemanager.czechgames.com/storage/files/seti-space-agencies/other-downloads/alien-species/SE2%20aliens%20aid%20EN%2014.pdf" }
            }
        };

        const categoryMap = {
            '행동': 'Actions',
            '착륙': 'Land',
            '스캔': 'Scan',
            '데이터 분석': 'Analyze Data',
            '탐사선/궤도선/착륙선': 'Probes / Orbiters / Landers',
            '기술': 'Techs',
            '미션': 'Missions',
            '마일스톤': 'Milestones',
            '점수 타일': 'Gold Scoring Tiles',
            '외계종': 'Alien Species',
            '솔로 모드': 'Solo Game',
            '카드': 'Cards',
            '외계종 카드': 'Alien Cards',
            '기관': 'Organizations',
            '확장 규칙': 'Expansion Rules',
            '프로모': 'Promo'
        };

        function detectInitialLanguage() {
            const userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            return userLang.startsWith('ko') ? 'KO' : 'EN';
        }

        let faqData = [];
        let currentLang = detectInitialLanguage();
        let currentEdition = '전체';
        let currentCategory = '전체';
        
        let loadTimer = null;
        let isLoaded = false;
        let toastTimer = null;

        const i18n = {
            KO: {
                title: "🛸 SETI 보드게임 FAQ",
                sub: "규칙, 에라타 및 카드 검색 시스템",
                all: "전체",
                base: "본판",
                exp: "확장",
                placeholder: "질문 제목, 답변 내용, 카드 번호(예: 15, #15, ET.1) 검색...",
                tip: "💡 팁: 숫자만 입력해도 해당 카드 번호(#15, #120 등)를 정밀하게 자동 검색합니다.",
                reloadText: "캐시 새로고침",
                alienRandomizer: "외계종 발견 랜더마이저",
                randomizer: "태양계 랜더마이저",
                bggBase: "BGG 본판 FAQ 원본",
                bggExp: "BGG 확장 FAQ 원본",
                copyLink: "링크 복사",
                noResult: "검색 조건에 맞는 FAQ가 없습니다.",
                loading: "FAQ 데이터를 불러오는 중입니다...",
                delayMsg: "데이터 로드가 지연되어 캐시를 삭제하고 자동 재시도합니다...",
                reloadBtn: "지금 강력 새로고침"
            },
            EN: {
                title: "🛸 SETI Board Game FAQ",
                sub: "Rules, Errata & Card Search System",
                all: "All",
                base: "Base Game",
                exp: "Expansion",
                placeholder: "Search questions, answers, card # (e.g. 15, #15, ET.1)...",
                tip: "💡 Tip: Type a pure number to automatically search for matching card #s (#15, #120, etc.).",
                reloadText: "Clear Cache & Reload",
                alienRandomizer: "Alien Discovery Randomizer",
                randomizer: "Solar System Randomizer",
                bggBase: "BGG Base FAQ (Official)",
                bggExp: "BGG Expansion FAQ (Official)",
                copyLink: "Copy Link",
                noResult: "No FAQs match your search criteria.",
                loading: "Loading FAQ data...",
                delayMsg: "Loading delayed over 30s. Clearing cache and auto-retrying...",
                reloadBtn: "Force Reload Now"
            }
        };

        function showToast(msg, icon = '✨') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-icon').textContent = icon;
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.add('hidden'), 2800);
        }

        function updateRulebookDropdown(lang) {
            const data = rulebookLinks[lang];
            document.getElementById('rulebook-btn-text').textContent = data.btnText;
            document.getElementById('rulebook-menu-title').textContent = data.menuTitle;

            document.getElementById('rb-link-base').href = data.base.url;
            document.getElementById('rb-text-base').textContent = data.base.title;

            document.getElementById('rb-link-base-alien').href = data.baseAlien.url;
            document.getElementById('rb-text-base-alien').textContent = data.baseAlien.title;

            document.getElementById('rb-link-aid').href = data.aid.url;
            document.getElementById('rb-text-aid').textContent = data.aid.title;

            document.getElementById('rb-link-exp').href = data.exp.url;
            document.getElementById('rb-text-exp').textContent = data.exp.title;

            document.getElementById('rb-link-exp-alien').href = data.expAlien.url;
            document.getElementById('rb-text-exp-alien').textContent = data.expAlien.title;
        }

        function toggleRulebookDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('rulebookDropdownMenu');
            menu.classList.toggle('hidden');
        }

        window.addEventListener('click', (e) => {
            const container = document.getElementById('rulebookDropdownContainer');
            const menu = document.getElementById('rulebookDropdownMenu');
            if (container && !container.contains(e.target) && menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = i18n[lang];
            document.getElementById('header-title').textContent = t.title;
            document.getElementById('header-sub').textContent = t.sub;
            document.getElementById('searchInput').placeholder = t.placeholder;
            document.getElementById('search-tip').textContent = t.tip;
            document.getElementById('reload-btn-text').textContent = t.reloadText;
            document.getElementById('link-alien-randomizer').textContent = t.alienRandomizer;
            document.getElementById('link-randomizer').textContent = t.randomizer;
            document.getElementById('link-bgg-base').textContent = t.bggBase;
            document.getElementById('link-bgg-exp').textContent = t.bggExp;

            updateRulebookDropdown(lang);
            updateTabCounts();
            renderCategories();
            renderFAQs();
        }

        function getBustedUrl(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}_cb=${Date.now()}`;
        }

        function startTimeoutTimer() {
            clearTimeout(loadTimer);
            loadTimer = setTimeout(() => {
                if (!isLoaded) {
                    if ('caches' in window) {
                        caches.keys().then(names => names.forEach(name => caches.delete(name)));
                    }
                    const t = i18n[currentLang];
                    document.getElementById('faqList').innerHTML = 
                        `<div class="text-center py-12 text-amber-400 font-medium leading-relaxed">
                            ${t.delayMsg}
                            <br><button onclick="forceReload()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-500 transition-colors">${t.reloadBtn}</button>
                         </div>`;
                    setTimeout(() => loadCSV(GVIZ_URL, true), 1000);
                }
            }, 30000);
        }

        function forceReload() {
            if ('caches' in window) {
                caches.keys().then(names => names.forEach(name => caches.delete(name)));
            }
            window.location.href = window.location.pathname + '?_t=' + Date.now();
        }

        function loadCSV(url, isFallback = false) {
            if (!isFallback) {
                isLoaded = false;
                startTimeoutTimer();
            }

            Papa.parse(getBustedUrl(url), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const parsed = results.data.map((item, idx) => {
                        const cat_ko = item['카테고리 (KO)'] ? item['카테고리 (KO)'].trim() : (item['카테고리'] ? item['카테고리'].trim() : '기타');
                        const cat_en = item['카테고리 (EN)'] ? item['카테고리 (EN)'].trim() : (categoryMap[cat_ko] || cat_ko);
                        
                        let ed = item['구분'] ? item['구분'].trim() : '';
                        if (!ed) {
                            ed = (cat_ko.includes('확장') || cat_ko.includes('기관') || cat_ko.includes('프로모')) ? '확장' : '본판';
                        }
                        
                        const q_ko = item['질문 (KO)'] ? item['질문 (KO)'].trim() : (item['질문'] ? item['질문'].trim() : '');
                        const a_ko = item['답변 (KO)'] ? item['답변 (KO)'].trim() : (item['답변'] ? item['답변'].trim() : '');
                        const q_en = item['질문 (EN)'] ? item['질문 (EN)'].trim() : q_ko;
                        const a_en = item['답변 (EN)'] ? item['답변 (EN)'].trim() : a_ko;

                        return {
                            id: idx,
                            edition: ed,
                            cat_ko: cat_ko,
                            cat_en: cat_en,
                            q_ko: q_ko,
                            a_ko: a_ko,
                            q_en: q_en,
                            a_en: a_en
                        };
                    }).filter(item => item.q_ko !== '' || item.q_en !== '');

                    if (parsed.length > 0) {
                        isLoaded = true;
                        clearTimeout(loadTimer);
                        faqData = parsed;
                        
                        setLanguage(currentLang);
                        checkDeepLink();
                    } else if (!isFallback) {
                        loadCSV(GVIZ_URL, true);
                    } else {
                        clearTimeout(loadTimer);
                        showError('FAQ 데이터를 읽지 못했습니다. 구글 시트 공유 설정을 확인해주세요.');
                    }
                },
                error: function(err) {
                    if (!isFallback) {
                        loadCSV(GVIZ_URL, true);
                    } else {
                        clearTimeout(loadTimer);
                        showError('데이터 로드에 실패했습니다. 아래 버튼을 눌러 강력 새로고침을 시도해보세요.<br><button onclick="forceReload()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-500">강력 새로고침</button>');
                    }
                }
            });
        }

        function showError(msg) {
            document.getElementById('faqList').innerHTML = `<div class="text-center py-12 text-red-400 font-medium">${msg}</div>`;
        }

        function updateTabCounts() {
            const t = i18n[currentLang];
            const baseCount = faqData.filter(d => d.edition === '본판').length;
            const expCount = faqData.filter(d => d.edition === '확장').length;
            
            document.getElementById('label-all').textContent = `${t.all} (${faqData.length})`;
            document.getElementById('label-base').textContent = `${t.base} (${baseCount})`;
            document.getElementById('label-exp').textContent = `${t.exp} (${expCount})`;
        }

        function setEdition(edition) {
            currentEdition = edition;
            currentCategory = '전체';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${edition}`).classList.add('active');
            renderCategories();
            renderFAQs();
        }

        function renderCategories() {
            let availableData = faqData;
            if (currentEdition !== '전체') {
                availableData = faqData.filter(item => item.edition === currentEdition);
            }

            const isKO = currentLang === 'KO';
            const categories = ['전체', ...new Set(availableData.map(item => isKO ? item.cat_ko : item.cat_en))];
            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';

            const tAll = i18n[currentLang].all;

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn px-4 py-2 rounded-full text-sm font-medium transition-colors ${cat === currentCategory ? 'active' : ''}`;
                btn.textContent = cat === '전체' ? tAll : cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderFAQs();
                };
                container.appendChild(btn);
            });
        }

        function toggleEnOriginal(index) {
            const box = document.getElementById(`en-box-${index}`);
            if (box) {
                box.classList.toggle('hidden');
            }
        }

        function generateFaqSlug(item, index) {
            const match = item.q_ko.match(/#([a-zA-Z0-9.\s]+)/);
            if (match) {
                return 'card-' + match[1].trim().toLowerCase().replace(/\s+/g, '-').replace(/\./g, '-');
            }
            return 'faq-' + (index + 1);
        }

        function copyFaqLink(slug, event) {
            if (event) event.stopPropagation();
            const url = `${window.location.origin}${window.location.pathname}#${slug}`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast(currentLang === 'KO' ? "🔗 해당 FAQ 공유 링크가 복사되었습니다!" : "🔗 FAQ link copied to clipboard!", "🔗");
                }).catch(() => fallbackCopyText(url));
            } else {
                fallbackCopyText(url);
            }
        }

        function fallbackCopyText(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast(currentLang === 'KO' ? "🔗 해당 FAQ 공유 링크가 복사되었습니다!" : "🔗 FAQ link copied to clipboard!", "🔗");
        }

        function checkDeepLink() {
            const hash = window.location.hash.replace('#', '').trim().toLowerCase();
            if (!hash || faqData.length === 0) return;

            const targetIndex = faqData.findIndex((item, idx) => {
                const slug = generateFaqSlug(item, idx);
                const cleanHash = hash.replace(/^card-/, '');
                return slug === hash || slug === 'card-' + hash || slug === ('card-' + cleanHash) || slug === ('faq-' + hash);
            });

            if (targetIndex !== -1) {
                const item = faqData[targetIndex];
                
                currentEdition = item.edition;
                currentCategory = '전체';
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                const activeTab = document.getElementById(`tab-${currentEdition}`);
                if (activeTab) activeTab.classList.add('active');

                renderCategories();
                renderFAQs();

                const answer = document.getElementById(`answer-${targetIndex}`);
                const icon = document.getElementById(`icon-${targetIndex}`);
                if (answer && answer.classList.contains('hidden')) {
                    answer.classList.remove('hidden');
                    if (icon) icon.textContent = '−';
                }

                setTimeout(() => {
                    const cardEl = document.getElementById(`faq-card-${targetIndex}`);
                    if (cardEl) {
                        cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        cardEl.classList.add('ring-2', 'ring-blue-500', 'shadow-[0_0_25px_rgba(59,130,246,0.6)]');
                        setTimeout(() => {
                            cardEl.classList.remove('ring-2', 'ring-blue-500', 'shadow-[0_0_25px_rgba(59,130,246,0.6)]');
                        }, 3000);
                    }
                }, 300);
            }
        }

        function renderFAQs() {
            const rawQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const listContainer = document.getElementById('faqList');
            const t = i18n[currentLang];
            
            const filtered = faqData.filter(item => {
                const matchesEdition = currentEdition === '전체' || item.edition === currentEdition;
                
                let matchesCategory = currentCategory === '전체';
                if (!matchesCategory) {
                    matchesCategory = (item.cat_ko === currentCategory || item.cat_en === currentCategory);
                }

                if (!matchesEdition || !matchesCategory) return false;
                if (!rawQuery) return true;

                const qKo = item.q_ko.toLowerCase();
                const aKo = item.a_ko.toLowerCase();
                const qEn = item.q_en.toLowerCase();
                const aEn = item.a_en.toLowerCase();

                if (qKo.includes(rawQuery) || aKo.includes(rawQuery) || qEn.includes(rawQuery) || aEn.includes(rawQuery)) return true;

                const cleanQuery = rawQuery.replace(/^#/, '');
                if (/^\d+$/.test(cleanQuery)) {
                    const num = parseInt(cleanQuery, 10);
                    const numPattern = new RegExp(`#0*${num}(?=[^0-9]|$)`, 'i');
                    if (numPattern.test(qKo) || numPattern.test(qEn)) return true;
                }

                if (/^et\s*\.?\s*\d+/i.test(rawQuery)) {
                    const etNum = rawQuery.replace(/[^0-9]/g, '');
                    const etPattern = new RegExp(`#et\\s*\\.?\\s*0*${etNum}`, 'i');
                    if (etPattern.test(qKo) || etPattern.test(qEn)) return true;
                }

                return false;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-12 text-gray-500">${t.noResult}</div>`;
                return;
            }

            listContainer.innerHTML = filtered.map((item, index) => {
                const badgeColor = item.edition === '확장' 
                    ? 'bg-purple-900/50 text-purple-300 border border-purple-700/50' 
                    : 'bg-blue-900/50 text-blue-300 border border-blue-700/50';
                
                const edLabel = currentLang === 'EN' ? (item.edition === '확장' ? 'Expansion' : 'Base') : item.edition;
                const catLabel = currentLang === 'EN' ? item.cat_en : item.cat_ko;
                const slug = generateFaqSlug(item, item.id);
                
                const displayQuestion = currentLang === 'EN' ? (item.q_en || item.q_ko) : (item.q_ko || item.q_en);
                const displayAnswer = currentLang === 'EN' ? (item.a_en || item.a_ko).replace(/\n/g, '<br>') : item.a_ko.replace(/\n/g, '<br>');

                return `
                <div class="faq-item rounded-2xl overflow-hidden" id="faq-card-${index}">
                    <button onclick="toggleFAQ(${index})" class="w-full text-left p-5 flex justify-between items-center focus:outline-none cursor-pointer">
                        <div>
                            <div class="flex gap-2 items-center mb-2.5">
                                <span class="text-xs px-2.5 py-1 rounded-md font-semibold ${badgeColor}">${edLabel}</span>
                                <span class="text-xs px-2.5 py-1 rounded-md bg-gray-800 text-gray-300 font-medium border border-gray-700/40">${catLabel}</span>
                            </div>
                            <h3 class="text-lg font-semibold text-white leading-snug">${displayQuestion}</h3>
                        </div>
                        <span id="icon-${index}" class="text-gray-400 text-xl ml-4 font-bold">+</span>
                    </button>

                    <!-- 답변 펼침 영역 -->
                    <div id="answer-${index}" class="hidden px-5 pb-5 pt-1 bg-[#0d1117]/50 border-t border-[#21262d]">
                        <!-- 독립된 답변 블록 카드 -->
                        <div class="p-4 rounded-xl bg-[#161b22] border border-[#30363d] text-sm text-gray-200 leading-relaxed shadow-inner">
                            ${displayAnswer}
                        </div>

                        <!-- 영어 원문 보기 블록 (토글 시 노출) -->
                        ${currentLang === 'KO' && item.a_en && item.a_en !== item.a_ko ? `
                            <div id="en-box-${index}" class="hidden mt-3 p-4 rounded-xl bg-[#161b22] border border-blue-900/50 text-xs sm:text-sm text-gray-300 leading-relaxed space-y-2">
                                <div class="font-bold text-blue-300 border-b border-[#30363d] pb-2 flex items-center gap-1.5">
                                    <span>🇺🇸</span> <span>${item.q_en}</span>
                                </div>
                                <div>${item.a_en.replace(/\n/g, '<br>')}</div>
                            </div>
                        ` : ''}

                        <!-- 하단 단일 액션 버튼 바 -->
                        <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
                            <div>
                                ${currentLang === 'KO' && item.a_en && item.a_en !== item.a_ko ? `
                                    <button onclick="toggleEnOriginal(${index})" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] hover:border-[#58a6ff] text-xs font-medium text-gray-200 hover:text-white transition-all shadow-sm focus:outline-none cursor-pointer">
                                        <span>🇺🇸</span>
                                        <span>영어 원문 보기</span>
                                    </button>
                                ` : ''}
                            </div>
                            <div>
                                <button onclick="copyFaqLink('${slug}', event)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] hover:border-blue-500 text-xs font-medium text-gray-300 hover:text-white transition-all shadow-sm focus:outline-none cursor-pointer">
                                    <span>🔗</span>
                                    <span>${t.copyLink}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function toggleFAQ(index) {
            const answer = document.getElementById(`answer-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            
            if (answer.classList.contains('hidden')) {
                answer.classList.remove('hidden');
                icon.textContent = '−';
            } else {
                answer.classList.add('hidden');
                icon.textContent = '+';
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderFAQs);
        loadCSV(PUBLISHED_URL);
    </script>
</body>
</html>
