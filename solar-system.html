<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>SETI · 태양계</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e19;color:#e9edf5;font-family:system-ui,-apple-system,sans-serif}main{max-width:820px;margin:auto;padding:24px 16px 36px}header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}h1{font-size:24px;margin:0}header span{font-size:12px;color:#a4b4cb;letter-spacing:.12em}.intro{color:#a4b4cb;font-size:14px;margin:12px 0 4px}.board{position:relative;width:min(100%,660px);aspect-ratio:1;margin:0 auto 12px;isolation:isolate}.board img{position:absolute;left:50%;top:50%;height:auto;transform:translate(-50%,-50%) rotate(0deg);transform-origin:50% 50%;transition:transform .35s ease-in-out;user-select:none;pointer-events:none}.controls{display:grid;gap:10px;max-width:600px;margin:auto}.row{display:grid;grid-template-columns:minmax(90px,1fr) 1fr 1fr;gap:10px;align-items:center;padding:12px;background:#111c2d;border:1px solid #24334a;border-radius:14px}.label{font-weight:700}.label small{display:block;color:#92a5be;font-size:11px;font-weight:400;margin-top:4px}button{font:inherit;font-size:14px;font-weight:600;min-height:46px;border:1px solid #3d577a;border-radius:10px;background:#1c304c;color:#e9edf5;cursor:pointer;touch-action:manipulation}button:hover{background:#2b4669}button:active{background:#355581}button:focus-visible{outline:3px solid #7dd3fc;outline-offset:3px}#status{text-align:center;color:#a4b4cb;min-height:20px;font-size:13px;margin:16px 0 0}.credits{font-size:11px;text-align:center;color:#71849f;margin-top:20px}@media(prefers-reduced-motion:reduce){.board img{transition:none}}@media(max-width:380px){main{padding:18px 10px}.row{gap:6px;padding:10px}button{font-size:12px}}
</style>
<script src="solar-system.js" defer></script>
</head>
<body><main>
<header><h1>태양계</h1><span>SETI</span></header>
<p class="intro">층을 선택해 시계 또는 반시계 방향으로 45°씩 회전하세요.</p>
<div class="board" role="img" aria-label="4개의 회전판과 중앙 태양으로 구성된 태양계">
<img id="wheel4" src="assets/solar/wheel4-cutout.png" width="1125" height="1125" style="width:100%;z-index:0" alt="" draggable="false">
<img id="wheel3" src="assets/solar/wheel3-cutout.png" width="702" height="702" style="width:62.4%;z-index:1" alt="" draggable="false">
<img id="wheel2" src="assets/solar/wheel2-cutout.png" width="548" height="548" style="width:48.711111%;z-index:2" alt="" draggable="false">
<img id="wheel1" src="assets/solar/wheel1-cutout.png" width="397" height="397" style="width:35.288889%;z-index:3" alt="" draggable="false">
<img id="sun" src="assets/solar/sun-cutout.png" width="95" height="95" style="width:8.444444%;z-index:4" alt="" draggable="false">
</div>
<section class="controls" aria-label="층별 회전 조작">
<div class="row"><div class="label">1층<small>휠 1 회전</small></div><button type="button" data-layer="1" data-direction="-1" aria-label="1층 반시계 방향 45도 회전">↶ 반시계</button><button type="button" data-layer="1" data-direction="1" aria-label="1층 시계 방향 45도 회전">↷ 시계</button></div>
<div class="row"><div class="label">2층<small>휠 1 · 2 회전</small></div><button type="button" data-layer="2" data-direction="-1" aria-label="2층 반시계 방향 45도 회전">↶ 반시계</button><button type="button" data-layer="2" data-direction="1" aria-label="2층 시계 방향 45도 회전">↷ 시계</button></div>
<div class="row"><div class="label">3층<small>휠 1 · 2 · 3 회전</small></div><button type="button" data-layer="3" data-direction="-1" aria-label="3층 반시계 방향 45도 회전">↶ 반시계</button><button type="button" data-layer="3" data-direction="1" aria-label="3층 시계 방향 45도 회전">↷ 시계</button></div>
</section>
<p id="status" role="status" aria-live="polite">휠 1: 0° · 휠 2: 0° · 휠 3: 0°</p>
<p class="credits">이미지: Czech Games Edition · SETI</p>
</main></body></html>
