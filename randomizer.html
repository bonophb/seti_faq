<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETI 외계종 발견 랜더마이저 / Alien Discovery Randomizer</title>
    
    <!-- PWA 메타 태그 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        .lang-btn { background-color: #161b22; border: 1px solid #30363d; color: #8b949e; }
        .lang-btn.active { background-color: #1f6beb; border-color: #388bfd; color: #ffffff; font-weight: 600; }
        .glass-card { background-color: #161b22; border: 1px solid #30363d; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto">
        <!-- 상단 네비게이션 -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
                <a href="./index.html" class="px-3.5 py-1.5 rounded-xl bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-[#58a6ff] text-xs sm:text-sm font-medium text-gray-300 hover:text-white transition-all inline-flex items-center gap-1.5 shadow-sm">
                    <span>📚</span>
                    <span id="nav-faq">SETI FAQ</span>
                </a>
                <button onclick="resetAll()" class="px-3.5 py-1.5 rounded-xl bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] hover:border-red-500 text-xs sm:text-sm font-medium text-red-400 hover:text-red-300 transition-all inline-flex items-center gap-1.5 shadow-sm cursor-pointer">
                    <span>🔄</span>
                    <span id="nav-reset">초기화</span>
                </button>
            </div>

            <!-- 언어 선택 -->
            <div class="inline-flex rounded-xl p-1 bg-[#161b22] border border-[#30363d] gap-1">
                <button onclick="setLanguage('KO')" id="lang-KO" class="lang-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all">🇰🇷 한국어</button>
                <button onclick="setLanguage('EN')" id="lang-EN" class="lang-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all">🇺🇸 English</button>
            </div>
        </div>

        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 id="header-title" class="text-3xl sm:text-4xl font-bold text-white mb-2">👾 외계종 발견 랜더마이저</h1>
            <p id="header-sub" class="text-gray-400 text-sm sm:text-base">본판 및 확장 외계종 추첨 돌림판 시스템</p>
        </header>

        <!-- 경고 알림 토스트 (최소 2종 제한 경고) -->
        <div id="toast" class="hidden fixed top-6 left-1/2 transform -translate-x-1/2 bg-red-900/90 border border-red-500 text-white px-5 py-3 rounded-xl shadow-2xl z-50 text-sm font-medium transition-all flex items-center gap-2">
            <span>⚠️</span>
            <span id="toast-msg">최소 2개의 외계종은 남아있어야 합니다.</span>
        </div>

        <!-- STEP 1: 게임 모드 선택 -->
        <div id="step-mode" class="space-y-6">
            <div class="text-center mb-4">
                <h2 id="title-step1" class="text-xl font-semibold text-white">1단계: 게임 모드를 선택하세요</h2>
                <p id="desc-step1" class="text-xs text-gray-400 mt-1">플레이할 게임 버전에 따라 외계종 풀이 결정됩니다.</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="selectMode('BASE')" class="glass-card hover:border-[#58a6ff] hover:bg-[#21262d] p-6 rounded-2xl text-left transition-all group cursor-pointer">
                    <div class="text-3xl mb-3">📦</div>
                    <h3 id="mode-base-title" class="text-lg font-bold text-white group-hover:text-blue-400 transition-colors">본판만 진행 (5종)</h3>
                    <p id="mode-base-desc" class="text-xs text-gray-400 mt-1">마스카마이트, 어노말리, 오우무아무아, 센타우리안, 엑설티안</p>
                </button>
                <button onclick="selectMode('EXP')" class="glass-card hover:border-[#58a6ff] hover:bg-[#21262d] p-6 rounded-2xl text-left transition-all group cursor-pointer">
                    <div class="text-3xl mb-3">🛸</div>
                    <h3 id="mode-exp-title" class="text-lg font-bold text-white group-hover:text-purple-400 transition-colors">본판 + 확장 포함 (8종)</h3>
                    <p id="mode-exp-desc" class="text-xs text-gray-400 mt-1">본판 5종 + 아르코스, 글리피즈, 아메바</p>
                </button>
            </div>
        </div>

        <!-- STEP 2: 외계종 밴(제외) 설정 -->
        <div id="step-ban" class="hidden space-y-6">
            <div class="text-center mb-2">
                <h2 id="title-step2" class="text-xl font-semibold text-white">2단계: 제외(밴)할 외계종 선택</h2>
                <p id="desc-step2" class="text-xs text-gray-400 mt-1">제외할 외계종을 클릭하여 비활성화하세요. (최소 2종 필수 잔여)</p>
            </div>

            <!-- 외계종 그리드 -->
            <div id="ban-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>

            <div class="flex justify-between items-center pt-4 border-t border-[#30363d]">
                <button onclick="goToStep('mode')" id="btn-back-mode" class="px-4 py-2 rounded-xl bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-xs text-gray-300 hover:text-white transition-colors cursor-pointer">
                    ← 모드 재선택
                </button>
                <button onclick="confirmBanSelection()" id="btn-confirm-ban" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all shadow-lg cursor-pointer">
                    외계종 추첨 단계로 이동 →
                </button>
            </div>
        </div>

        <!-- STEP 3: 좌/우 외계종 슬롯 및 추첨 진행 -->
        <div id="step-slots" class="hidden space-y-6">
            <div class="text-center mb-2">
                <h2 id="title-step3" class="text-xl font-semibold text-white">3단계: 왼쪽 및 오른쪽 외계종 발견 추첨</h2>
                <p id="desc-step3" class="text-xs text-gray-400 mt-1">각 슬롯의 버튼을 눌러 돌림판으로 외계종을 무작위 추첨하세요.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- 왼쪽 외계종 슬롯 -->
                <div id="slot-left" class="glass-card p-6 rounded-2xl text-center flex flex-col justify-between min-h-[220px] transition-all">
                    <div>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-blue-900/50 text-blue-300 border border-blue-700/50" id="label-left-slot">왼쪽 외계종</span>
                        <div id="left-result" class="my-6">
                            <span class="text-gray-500 text-sm" id="text-left-empty">미선택 상태</span>
                        </div>
                    </div>
                    <button id="btn-spin-left" onclick="openWheelModal('LEFT')" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold transition-all shadow-md cursor-pointer">
                        👈 <span id="text-btn-spin-left">왼쪽 외계종 추첨하기</span>
                    </button>
                </div>

                <!-- 오른쪽 외계종 슬롯 -->
                <div id="slot-right" class="glass-card p-6 rounded-2xl text-center flex flex-col justify-between min-h-[220px] transition-all">
                    <div>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-purple-900/50 text-purple-300 border border-purple-700/50" id="label-right-slot">오른쪽 외계종</span>
                        <div id="right-result" class="my-6">
                            <span class="text-gray-500 text-sm" id="text-right-empty">미선택 상태</span>
                        </div>
                    </div>
                    <button id="btn-spin-right" onclick="openWheelModal('RIGHT')" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-bold transition-all shadow-md cursor-pointer">
                        👉 <span id="text-btn-spin-right">오른쪽 외계종 추첨하기</span>
                    </button>
                </div>
            </div>

            <div class="text-center pt-4">
                <button onclick="goToStep('ban')" id="btn-back-ban" class="text-xs text-gray-400 hover:text-white underline cursor-pointer">
                    ← 제외(밴) 목록 다시 수정하기
                </button>
            </div>
        </div>
    </div>

    <!-- 룰렛 돌림판 모달 팝업 -->
    <div id="wheelModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass-card max-w-md w-full p-6 rounded-3xl text-center relative border border-[#30363d] shadow-2xl">
            <button onclick="closeWheelModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold focus:outline-none cursor-pointer">✕</button>
            
            <h3 id="wheel-modal-title" class="text-lg font-bold text-white mb-4">외계종 돌림판 추첨</h3>

            <!-- 룰렛 영역 (상단 화살표 포함) -->
            <div class="relative w-[280px] sm:w-[320px] h-[280px] sm:h-[320px] mx-auto my-4 flex items-center justify-center">
                <!-- 상단 화살표 (12시 방향) -->
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 z-20">
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-amber-400 drop-shadow-[0_4px_6px_rgba(251,191,36,0.8)]"></div>
                </div>
                <!-- 캔버스 돌림판 -->
                <canvas id="wheelCanvas" width="600" height="600" class="w-full h-full rounded-full shadow-2xl border-4 border-[#30363d]"></canvas>
            </div>

            <!-- 추첨 제어 버튼 -->
            <div class="mt-6">
                <button id="btn-spin-action" onclick="handleSpinAction()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-base shadow-lg transition-all cursor-pointer">
                    🎲 <span id="btn-spin-label">추첨 시작</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // PWA 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }

        // 외계종 마스터 데이터베이스
        const ALIEN_SPECIES = [
            // 본판 (5종)
            { id: 'mascamites', ko: '마스카마이트', en: 'MASCAMITES', exp: false, color: '#1d4ed8' },
            { id: 'anomalies', ko: '어노말리', en: 'ANOMALIES', exp: false, color: '#7e22ce' },
            { id: 'oumuamua', ko: '오우무아무아', en: '‘OUMUAMUA', exp: false, color: '#b45309' },
            { id: 'centaurians', ko: '센타우리안', en: 'CENTAURIANS', exp: false, color: '#0e7490' },
            { id: 'exertians', ko: '엑설티안', en: 'EXERTIANS', exp: false, color: '#b91c1c' },
            // 확장 (3종)
            { id: 'arkhos', ko: '아르코스', en: 'ARKHOS', exp: true, color: '#047857' },
            { id: 'glyphids', ko: '글리피즈', en: 'GLYPHIDS', exp: true, color: '#be185d' },
            { id: 'amoeba', ko: '아메바', en: 'AMOEBA', exp: true, color: '#c2410c' }
        ];

        // 브라우저 언어 자동 감지
        function detectLanguage() {
            const userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            return userLang.startsWith('ko') ? 'KO' : 'EN';
        }

        // 상태 변수
        let currentLang = detectLanguage();
        let appState = {
            step: 'mode', // 'mode', 'ban', 'slots'
            mode: null,   // 'BASE', 'EXP'
            banned: [],   // [id, ...]
            leftWinner: null,
            rightWinner: null
        };

        // 로컬스토리지 복원
        function loadState() {
            const saved = localStorage.getItem('seti_randomizer_state');
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                } catch(e) {}
            }
            const savedLang = localStorage.getItem('seti_randomizer_lang');
            if (savedLang) currentLang = savedLang;
        }

        function saveState() {
            localStorage.setItem('seti_randomizer_state', JSON.stringify(appState));
            localStorage.setItem('seti_randomizer_lang', currentLang);
        }

        // 다국어 텍스트 사전
        const i18n = {
            KO: {
                title: "👾 외계종 발견 랜더마이저",
                sub: "본판 및 확장 외계종 추첨 돌림판 시스템",
                faq: "SETI FAQ",
                reset: "초기화",
                step1Title: "1단계: 게임 모드를 선택하세요",
                step1Desc: "플레이할 게임 버전에 따라 외계종 풀이 결정됩니다.",
                modeBaseTitle: "본판만 진행 (5종)",
                modeBaseDesc: "마스카마이트, 어노말리, 오우무아무아, 센타우리안, 엑설티안",
                modeExpTitle: "본판 + 확장 포함 (8종)",
                modeExpDesc: "본판 5종 + 아르코스, 글리피즈, 아메바",
                step2Title: "2단계: 제외(밴)할 외계종 선택",
                step2Desc: "제외할 외계종을 클릭하여 비활성화하세요. (최소 2종 필수 잔여)",
                btnBackMode: "← 모드 재선택",
                btnConfirmBan: "외계종 추첨 단계로 이동 →",
                step3Title: "3단계: 왼쪽 및 오른쪽 외계종 발견 추첨",
                step3Desc: "각 슬롯의 버튼을 눌러 돌림판으로 외계종을 무작위 추첨하세요.",
                leftSlot: "왼쪽 외계종",
                rightSlot: "오른쪽 외계종",
                empty: "미선택 상태",
                spinLeft: "왼쪽 외계종 추첨하기",
                spinRight: "오른쪽 외계종 추첨하기",
                backBan: "← 제외(밴) 목록 다시 수정하기",
                bannedTag: "제외됨 (Banned)",
                spinStart: "추첨 시작",
                spinStop: "🛑 멈추기",
                wheelTitleLeft: "왼쪽 외계종 돌림판 추첨",
                wheelTitleRight: "오른쪽 외계종 돌림판 추첨",
                warnMin: "최소 2개의 외계종은 남아있어야 합니다!",
                toastWin: "외계종이 당첨되었습니다!"
            },
            EN: {
                title: "👾 Alien Discovery Randomizer",
                sub: "Base & Expansion Alien Discovery Wheel",
                faq: "SETI FAQ",
                reset: "Reset",
                step1Title: "Step 1: Select Game Mode",
                step1Desc: "Choose the alien species pool based on your game setup.",
                modeBaseTitle: "Base Game Only (5 Species)",
                modeBaseDesc: "MASCAMITES, ANOMALIES, ‘OUMUAMUA, CENTAURIANS, EXERTIANS",
                modeExpTitle: "Base + Expansion (8 Species)",
                modeExpDesc: "Base 5 Species + ARKHOS, GLYPHIDS, AMOEBA",
                step2Title: "Step 2: Select Banned Species",
                step2Desc: "Click to exclude unwanted species. (At least 2 species must remain)",
                btnBackMode: "← Select Mode",
                btnConfirmBan: "Proceed to Discovery Slots →",
                step3Title: "Step 3: Discover Left & Right Aliens",
                step3Desc: "Spin the wheel for each slot to discover alien species.",
                leftSlot: "Left Alien Species",
                rightSlot: "Right Alien Species",
                empty: "Not Selected",
                spinLeft: "Spin Left Alien",
                spinRight: "Spin Right Alien",
                backBan: "← Modify Banned Species",
                bannedTag: "Banned",
                spinStart: "Start Spin",
                spinStop: "🛑 STOP",
                wheelTitleLeft: "Left Alien Species Wheel",
                wheelTitleRight: "Right Alien Species Wheel",
                warnMin: "At least 2 alien species must remain!",
                toastWin: "Alien Species Discovered!"
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = i18n[lang];
            document.getElementById('header-title').textContent = t.title;
            document.getElementById('header-sub').textContent = t.sub;
            document.getElementById('nav-faq').textContent = t.faq;
            document.getElementById('nav-reset').textContent = t.reset;

            document.getElementById('title-step1').textContent = t.step1Title;
            document.getElementById('desc-step1').textContent = t.step1Desc;
            document.getElementById('mode-base-title').textContent = t.modeBaseTitle;
            document.getElementById('mode-base-desc').textContent = t.modeBaseDesc;
            document.getElementById('mode-exp-title').textContent = t.modeExpTitle;
            document.getElementById('mode-exp-desc').textContent = t.modeExpDesc;

            document.getElementById('title-step2').textContent = t.step2Title;
            document.getElementById('desc-step2').textContent = t.step2Desc;
            document.getElementById('btn-back-mode').textContent = t.btnBackMode;
            document.getElementById('btn-confirm-ban').textContent = t.btnConfirmBan;

            document.getElementById('title-step3').textContent = t.step3Title;
            document.getElementById('desc-step3').textContent = t.step3Desc;
            document.getElementById('label-left-slot').textContent = t.leftSlot;
            document.getElementById('label-right-slot').textContent = t.rightSlot;
            document.getElementById('text-btn-spin-left').textContent = t.spinLeft;
            document.getElementById('text-btn-spin-right').textContent = t.spinRight;
            document.getElementById('btn-back-ban').textContent = t.backBan;

            saveState();
            renderUI();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        function selectMode(mode) {
            appState.mode = mode;
            appState.banned = [];
            appState.leftWinner = null;
            appState.rightWinner = null;
            goToStep('ban');
        }

        function goToStep(step) {
            appState.step = step;
            saveState();
            renderUI();
        }

        function toggleBan(id) {
            const currentPool = ALIEN_SPECIES.filter(s => appState.mode === 'EXP' || !s.exp);
            const isCurrentlyBanned = appState.banned.includes(id);

            if (!isCurrentlyBanned) {
                // 밴을 추가하려고 할 때: 잔여 외계종이 2종 이하가 되는지 검사
                const remainingCount = currentPool.length - (appState.banned.length + 1);
                if (remainingCount < 2) {
                    showToast(i18n[currentLang].warnMin);
                    return;
                }
                appState.banned.push(id);
            } else {
                appState.banned = appState.banned.filter(bId => bId !== id);
            }

            // 밴이 바뀌면 이전 슬롯 결과 초기화
            appState.leftWinner = null;
            appState.rightWinner = null;
            saveState();
            renderBanGrid();
        }

        function confirmBanSelection() {
            goToStep('slots');
        }

        function resetAll() {
            appState = {
                step: 'mode',
                mode: null,
                banned: [],
                leftWinner: null,
                rightWinner: null
            };
            saveState();
            renderUI();
        }

        function renderBanGrid() {
            const grid = document.getElementById('ban-grid');
            grid.innerHTML = '';

            const available = ALIEN_SPECIES.filter(s => appState.mode === 'EXP' || !s.exp);

            available.forEach(item => {
                const isBanned = appState.banned.includes(item.id);
                const name = currentLang === 'KO' ? item.ko : item.en;
                
                const card = document.createElement('div');
                card.className = `alien-card p-4 rounded-xl border text-center cursor-pointer transition-all ${isBanned ? 'bg-[#0d1117] border-red-900/60 opacity-40 grayscale' : 'glass-card hover:border-[#58a6ff]'}`;
                card.onclick = () => toggleBan(item.id);

                card.innerHTML = `
                    <div class="w-8 h-8 rounded-full mx-auto mb-2 flex items-center justify-center font-bold text-white text-xs" style="background-color: ${item.color}">
                        ${item.id[0].toUpperCase()}
                    </div>
                    <div class="text-sm font-bold text-white ${isBanned ? 'line-through text-gray-500' : ''}">${name}</div>
                    ${item.exp ? `<span class="text-[10px] text-purple-400 font-semibold mt-1 inline-block">[${currentLang === 'KO' ? '확장' : 'EXP'}]</span>` : ''}
                    ${isBanned ? `<div class="text-[10px] text-red-400 font-bold mt-1">${i18n[currentLang].bannedTag}</div>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function renderSlots() {
            const t = i18n[currentLang];

            // 왼쪽 슬롯 렌더링
            const leftResult = document.getElementById('left-result');
            const btnSpinLeft = document.getElementById('btn-spin-left');
            if (appState.leftWinner) {
                const sp = ALIEN_SPECIES.find(s => s.id === appState.leftWinner);
                const name = currentLang === 'KO' ? sp.ko : sp.en;
                leftResult.innerHTML = `
                    <div class="p-4 rounded-xl border border-blue-500/50 bg-blue-950/30">
                        <div class="text-2xl font-black text-blue-300">${name}</div>
                        <div class="text-xs text-gray-400 mt-1">${sp.en}</div>
                    </div>
                `;
                btnSpinLeft.classList.add('hidden');
            } else {
                leftResult.innerHTML = `<span class="text-gray-500 text-sm">${t.empty}</span>`;
                btnSpinLeft.classList.remove('hidden');
            }

            // 오른쪽 슬롯 렌더링
            const rightResult = document.getElementById('right-result');
            const btnSpinRight = document.getElementById('btn-spin-right');
            if (appState.rightWinner) {
                const sp = ALIEN_SPECIES.find(s => s.id === appState.rightWinner);
                const name = currentLang === 'KO' ? sp.ko : sp.en;
                rightResult.innerHTML = `
                    <div class="p-4 rounded-xl border border-purple-500/50 bg-purple-950/30">
                        <div class="text-2xl font-black text-purple-300">${name}</div>
                        <div class="text-xs text-gray-400 mt-1">${sp.en}</div>
                    </div>
                `;
                btnSpinRight.classList.add('hidden');
            } else {
                rightResult.innerHTML = `<span class="text-gray-500 text-sm">${t.empty}</span>`;
                btnSpinRight.classList.remove('hidden');
            }
        }

        function renderUI() {
            document.getElementById('step-mode').classList.toggle('hidden', appState.step !== 'mode');
            document.getElementById('step-ban').classList.toggle('hidden', appState.step !== 'ban');
            document.getElementById('step-slots').classList.toggle('hidden', appState.step !== 'slots');

            if (appState.step === 'ban') renderBanGrid();
            if (appState.step === 'slots') renderSlots();
        }

        // ==========================================
        // 원형 돌림판 (Canvas 룰렛) 추첨 엔진
        // ==========================================
        let currentSlotTarget = null; // 'LEFT' or 'RIGHT'
        let wheelCandidates = [];
        let currentRotation = 0;
        let isSpinning = false;
        let isStopping = false;
        let animationFrameId = null;
        let spinStartTime = 0;
        let stopStartTime = 0;
        let startRotationAtStop = 0;
        let targetFinalRotation = 0;
        let stopDuration = 3800; // 3.8초 동안 감속 정지

        function openWheelModal(slot) {
            currentSlotTarget = slot;
            const t = i18n[currentLang];
            document.getElementById('wheel-modal-title').textContent = slot === 'LEFT' ? t.wheelTitleLeft : t.wheelTitleRight;

            // 추첨 후보 풀 구성: (전체 외계종) - (모드 외) - (밴 외계종) - (반대편 슬롯 당첨 외계종)
            const oppositeWinner = slot === 'LEFT' ? appState.rightWinner : appState.leftWinner;
            wheelCandidates = ALIEN_SPECIES.filter(s => {
                const matchesMode = appState.mode === 'EXP' || !s.exp;
                const notBanned = !appState.banned.includes(s.id);
                const notOpposite = s.id !== oppositeWinner;
                return matchesMode && notBanned && notOpposite;
            });

            isSpinning = false;
            isStopping = false;
            currentRotation = 0;
            updateSpinButtonState();
            
            document.getElementById('wheelModal').classList.remove('hidden');
            drawWheel(0);
        }

        function closeWheelModal() {
            if (isSpinning && !isStopping) return; // 회전 중 닫기 방지
            cancelAnimationFrame(animationFrameId);
            document.getElementById('wheelModal').classList.add('hidden');
        }

        function updateSpinButtonState() {
            const btn = document.getElementById('btn-spin-action');
            const label = document.getElementById('btn-spin-label');
            const t = i18n[currentLang];

            if (!isSpinning) {
                btn.className = "w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-base shadow-lg transition-all cursor-pointer";
                label.textContent = t.spinStart;
                btn.disabled = false;
            } else if (isSpinning && !isStopping) {
                btn.className = "w-full py-3.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold text-base shadow-lg transition-all animate-pulse cursor-pointer";
                label.textContent = t.spinStop;
                btn.disabled = false;
            } else {
                btn.className = "w-full py-3.5 rounded-xl bg-gray-700 text-gray-400 font-bold text-base opacity-75 cursor-not-allowed";
                label.textContent = currentLang === 'KO' ? "감속 중..." : "Slowing down...";
                btn.disabled = true;
            }
        }

        function handleSpinAction() {
            if (!isSpinning) {
                // 회전 시작
                isSpinning = true;
                isStopping = false;
                spinStartTime = performance.now();
                updateSpinButtonState();
                requestAnimationFrame(animateInfiniteSpin);
            } else if (isSpinning && !isStopping) {
                // 멈추기 버튼 클릭: 내부 무작위 당첨자 선정 및 감속 애니메이션 개시
                isStopping = true;
                stopStartTime = performance.now();
                startRotationAtStop = currentRotation;
                updateSpinButtonState();

                // 1. 내부 무작위 1/N 균등 확률 당첨자 선정
                const winnerIndex = Math.floor(Math.random() * wheelCandidates.length);
                const winner = wheelCandidates[winnerIndex];

                // 2. 12시 방향 상단 화살표에 정확히 멈추기 위한 회전각 계산
                const sliceAngle = (Math.PI * 2) / wheelCandidates.length;
                const winnerCenterAngle = (winnerIndex + 0.5) * sliceAngle;
                
                // 3~4바퀴 추가 회전 + 상단 12시(3π/2) 정렬
                const fullRotations = Math.PI * 2 * 4;
                const currentMod = currentRotation % (Math.PI * 2);
                let targetMod = (Math.PI * 1.5 - winnerCenterAngle) % (Math.PI * 2);
                if (targetMod < 0) targetMod += Math.PI * 2;

                let delta = targetMod - currentMod;
                if (delta < 0) delta += Math.PI * 2;

                // 조각 내부 자연스러운 랜덤 오차 (가장자리 경계선 침범 방지)
                const safeJitter = (Math.random() - 0.5) * (sliceAngle * 0.5);
                targetFinalRotation = currentRotation + fullRotations + delta + safeJitter;

                requestAnimationFrame((t) => animateDeceleration(t, winner));
            }
        }

        function animateInfiniteSpin(timestamp) {
            if (!isSpinning || isStopping) return;
            currentRotation += 0.35; // 고속 회전 속도
            drawWheel(currentRotation);
            animationFrameId = requestAnimationFrame(animateInfiniteSpin);
        }

        // Cubic Ease-Out 감속 곡선
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function animateDeceleration(timestamp, winner) {
            const elapsed = timestamp - stopStartTime;
            const progress = Math.min(elapsed / stopDuration, 1);
            const ease = easeOutCubic(progress);

            currentRotation = startRotationAtStop + (targetFinalRotation - startRotationAtStop) * ease;
            drawWheel(currentRotation);

            if (progress < 1) {
                animationFrameId = requestAnimationFrame((t) => animateDeceleration(t, winner));
            } else {
                // 추첨 완료
                isSpinning = false;
                isStopping = false;
                
                if (currentSlotTarget === 'LEFT') {
                    appState.leftWinner = winner.id;
                } else {
                    appState.rightWinner = winner.id;
                }
                saveState();

                setTimeout(() => {
                    closeWheelModal();
                    renderSlots();
                }, 800);
            }
        }

        function drawWheel(rotation) {
            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const center = width / 2;
            const radius = center - 20;

            ctx.clearRect(0, 0, width, height);

            const numSlices = wheelCandidates.length;
            if (numSlices === 0) return;
            const sliceAngle = (Math.PI * 2) / numSlices;

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(rotation);

            for (let i = 0; i < numSlices; i++) {
                const item = wheelCandidates[i];
                const angleStart = i * sliceAngle;
                const angleEnd = (i + 1) * sliceAngle;

                // 섹터 부채꼴 그리기
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, angleStart, angleEnd);
                ctx.closePath();
                ctx.fillStyle = item.color;
                ctx.fill();

                // 섹터 테두리선
                ctx.strokeStyle = '#0d1117';
                ctx.lineWidth = 6;
                ctx.stroke();

                // 외계종 명칭 텍스트 렌더링
                ctx.save();
                ctx.rotate(angleStart + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px system-ui, sans-serif';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 6;
                
                const label = currentLang === 'KO' ? item.ko : item.en;
                ctx.fillText(label, radius - 30, 8);
                ctx.restore();
            }

            // 중앙 허브 서클
            ctx.beginPath();
            ctx.arc(0, 0, 36, 0, Math.PI * 2);
            ctx.fillStyle = '#0d1117';
            ctx.fill();
            ctx.strokeStyle = '#58a6ff';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.restore();
        }

        // 초기 로드 실행
        loadState();
        setLanguage(currentLang);
    </script>
</body>
</html>
